services:
  server:
    build:
      context: ./server
    container_name: food-delivery-server-container
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env

  client:
    build:
      context: ./client
    container_name: food-delivery-client-container
    ports:
      - "8080:80"
    depends_on:
      - server